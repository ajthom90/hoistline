# Hoistline hub. Copy .env.example to .env, fill it in, then: docker compose up -d
# See docs/quickstart.md.
services:
  hub:
    image: ${HUB_IMAGE:-ghcr.io/ajthom90/hoistline-hub:latest}
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      HOISTLINE_ALLOWED_USERS: ${HOISTLINE_ALLOWED_USERS:-}
    # Loopback only: reach the hub from the internet through the tunnel, never by opening this port.
    ports:
      - "127.0.0.1:${HUB_PORT:-3000}:3000"
    # The SQLite database (it holds the job-signing key and cookie secret). The directory must be writable by
    # uid 10001 and private to it: chown 10001:10001 and chmod 700.
    volumes:
      - ${HUB_DATA_DIR:-./data}:/data

  # Optional: Cloudflare Tunnel in this compose project (see docs/cloudflare-tunnel.md).
  # It shares the hub's network namespace, so it reaches the hub over loopback (point the tunnel's public hostname
  # at http://localhost:3000). The hub trusts X-Forwarded-For only from loopback. From anywhere else every client
  # shares each per-IP rate-limit bucket: /pair 10/min, /authorize 100/15 min, /token 50/15 min,
  # /register 20/hour, /revoke 50/15 min.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest   # pin a version tag
  #   restart: unless-stopped
  #   network_mode: "service:hub"
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
  #   depends_on:
  #     - hub
